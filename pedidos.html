<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OrderFlow | Pedidos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <header class="bg-white border-bottom">
    <div class="container py-3">
      <a class="brand" href="index.html"><i class="bi bi-box-seam"></i> OrderFlow</a>
      <nav class="nav nav-pills flex-nowrap gap-2 mt-3 overflow-x-auto" aria-label="Navegação principal">
        <a class="nav-link" href="index.html">Início</a>
        <a class="nav-link" href="clientes.html">Clientes</a>
        <a class="nav-link" href="produtos.html">Produtos</a>
        <a class="nav-link active" aria-current="page" href="pedidos.html">Pedidos <span class="badge rounded-pill text-bg-light ms-1" id="pending-count">0</span></a>
        <a class="nav-link" href="novo-pedido.html">Novo pedido</a>
      </nav>
    </div>
  </header>
  <main class="container py-4">
    <div class="d-flex flex-wrap align-items-end justify-content-between gap-3 mb-4">
      <div><p class="text-secondary mb-1">ACOMPANHAMENTO</p><h1 class="h2 mb-1">Pedidos</h1><p class="text-secondary mb-0">Consulte e atualize cada pedido.</p></div>
      <a class="btn btn-primary" href="novo-pedido.html"><i class="bi bi-plus-lg me-1"></i>Novo pedido</a>
    </div>
    <section class="card">
      <div class="card-header bg-white d-flex flex-wrap gap-2">
        <input class="form-control search-field" id="order-search" type="search" placeholder="Buscar pedido ou cliente" aria-label="Buscar pedidos">
        <select class="form-select filter-field" id="order-status-filter" aria-label="Filtrar pedidos por status"><option value="">Todos os status</option><option>Pendente</option><option>Em processamento</option><option>Enviado</option><option>Entregue</option><option>Cancelado</option></select>
        <select class="form-select filter-field" id="order-sort" aria-label="Ordenar pedidos"><option value="newest">Mais recentes</option><option value="oldest">Mais antigos</option><option value="highest">Maior valor</option><option value="lowest">Menor valor</option></select>
      </div>
      <div class="table-responsive"><table class="table table-hover align-middle mb-0">
        <thead><tr><th>Pedido</th><th>Cliente</th><th>Data</th><th>Itens</th><th>Total</th><th>Status</th><th>Ações</th></tr></thead>
        <tbody id="orders-list"></tbody>
      </table></div>
      <div class="card-footer bg-white small text-secondary" id="orders-count"></div>
    </section>
  </main>
  <div class="modal fade" id="delete-modal" tabindex="-1" aria-labelledby="delete-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm"><div class="modal-content"><div class="modal-header"><div><h2 class="modal-title fs-5" id="delete-modal-title">Excluir registro?</h2><p class="small text-secondary mb-0" id="delete-modal-message"></p></div><button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Fechar"></button></div><div class="modal-footer"><button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-danger" id="confirm-delete" type="button">Excluir</button></div></div></div>
  </div>
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container" aria-live="polite" aria-atomic="true"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/validacoes.js"></script>
  <script src="js/calculadora.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
