<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OrderFlow | Clientes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <header class="bg-white border-bottom">
    <div class="container py-3">
      <a class="brand" href="index.html"><i class="bi bi-box-seam"></i> OrderFlow</a>
      <nav class="nav nav-pills flex-nowrap gap-2 mt-3 overflow-x-auto" aria-label="Navegação principal">
        <a class="nav-link" href="index.html">Início</a>
        <a class="nav-link active" aria-current="page" href="clientes.html">Clientes</a>
        <a class="nav-link" href="produtos.html">Produtos</a>
        <a class="nav-link" href="pedidos.html">Pedidos <span class="badge rounded-pill text-bg-light ms-1" id="pending-count">0</span></a>
        <a class="nav-link" href="novo-pedido.html">Novo pedido</a>
      </nav>
    </div>
  </header>
  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
      <div><p class="text-secondary mb-1">CADASTROS</p><h1 class="h2 mb-1">Clientes</h1><p class="text-secondary mb-0">Cadastre e encontre seus clientes.</p></div>
      <button class="btn btn-primary" type="button" data-action="add-customer"><i class="bi bi-person-plus me-1"></i>Novo cliente</button>
    </div>
    <section class="card">
      <div class="card-header bg-white row g-2 align-items-center mx-0">
        <label class="visually-hidden" for="customer-search">Buscar cliente</label>
        <div class="col-12 col-md-7"><input class="form-control search-field" id="customer-search" type="search" placeholder="Buscar por nome ou e-mail"></div>
        <span class="col small text-secondary text-md-end" id="customers-count"></span>
      </div>
      <div class="table-responsive"><table class="table table-hover align-middle mb-0">
        <thead><tr><th>Nome</th><th>E-mail</th><th>Telefone</th><th>Pedidos</th><th>Total entregue</th><th>Ações</th></tr></thead>
        <tbody id="customers-list"></tbody>
      </table></div>
    </section>
  </main>
  <div class="modal fade" id="customer-modal" tabindex="-1" aria-labelledby="customer-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
      <form id="customer-form"><div class="modal-header"><h2 class="modal-title fs-5" id="customer-modal-title">Novo cliente</h2><button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Fechar"></button></div>
        <div class="modal-body"><div class="mb-3"><label class="form-label" for="customer-name">Nome</label><input class="form-control" id="customer-name" required></div><div class="mb-3"><label class="form-label" for="customer-email">E-mail</label><input class="form-control" id="customer-email" type="email" required></div><div><label class="form-label" for="customer-phone">Telefone</label><input class="form-control" id="customer-phone" type="tel"></div></div>
        <div class="modal-footer"><button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary" type="submit">Salvar</button></div>
      </form>
    </div></div>
  </div>
  <div class="modal fade" id="delete-modal" tabindex="-1" aria-labelledby="delete-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm"><div class="modal-content"><div class="modal-header"><div><h2 class="modal-title fs-5" id="delete-modal-title">Excluir registro?</h2><p class="small text-secondary mb-0" id="delete-modal-message"></p></div><button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Fechar"></button></div><div class="modal-footer"><button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-danger" id="confirm-delete" type="button">Excluir</button></div></div></div>
  </div>
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container" aria-live="polite" aria-atomic="true"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/validacoes.js"></script>
  <script src="js/calculadora.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
