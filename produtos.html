<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OrderFlow | Produtos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <header class="bg-white border-bottom">
    <div class="container py-3">
      <a class="brand" href="index.html"><i class="bi bi-box-seam"></i> OrderFlow</a>
      <nav class="nav nav-pills flex-nowrap gap-2 mt-3 overflow-x-auto" aria-label="Navegação principal">
        <a class="nav-link" href="index.html">Início</a>
        <a class="nav-link" href="clientes.html">Clientes</a>
        <a class="nav-link active" aria-current="page" href="produtos.html">Produtos</a>
        <a class="nav-link" href="pedidos.html">Pedidos <span class="badge rounded-pill text-bg-light ms-1" id="pending-count">0</span></a>
        <a class="nav-link" href="novo-pedido.html">Novo pedido</a>
      </nav>
    </div>
  </header>
  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
      <div><p class="text-secondary mb-1">CATÁLOGO</p><h1 class="h2 mb-1">Produtos</h1><p class="text-secondary mb-0">Organize seu catálogo e acompanhe o estoque.</p></div>
      <button class="btn btn-primary" type="button" data-action="add-product"><i class="bi bi-plus-lg me-1"></i>Novo produto</button>
    </div>
    <section class="card">
      <div class="card-header bg-white d-flex flex-wrap gap-2">
        <input class="form-control search-field" id="product-search" type="search" placeholder="Buscar produto" aria-label="Buscar produtos">
        <select class="form-select filter-field" id="category-filter" aria-label="Filtrar por categoria"><option value="">Todas as categorias</option><option>Vestuário</option><option>Acessórios</option><option>Casa</option></select>
        <select class="form-select filter-field" id="stock-filter" aria-label="Filtrar por estoque"><option value="">Qualquer estoque</option><option value="available">Disponível</option><option value="low">Estoque baixo</option><option value="out">Sem estoque</option></select>
        <span class="small text-secondary align-self-center ms-auto" id="products-count"></span>
      </div>
      <div class="table-responsive"><table class="table table-hover align-middle mb-0">
        <thead><tr><th>Produto</th><th>Categoria</th><th>SKU</th><th>Estoque</th><th>Preço</th><th>Status</th><th>Ações</th></tr></thead>
        <tbody id="products-list"></tbody>
      </table></div>
    </section>
  </main>
  <div class="modal fade" id="product-modal" tabindex="-1" aria-labelledby="product-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
      <form id="product-form"><div class="modal-header"><h2 class="modal-title fs-5" id="product-modal-title">Novo produto</h2><button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Fechar"></button></div>
        <div class="modal-body"><div class="mb-3"><label class="form-label" for="product-name">Nome</label><input class="form-control" id="product-name" required></div><div class="row g-3 mb-3"><div class="col-6"><label class="form-label" for="product-price">Preço (R$)</label><input class="form-control" id="product-price" type="number" min="0.01" step="0.01" required></div><div class="col-6"><label class="form-label" for="product-stock">Estoque</label><input class="form-control" id="product-stock" type="number" min="0" step="1" required></div></div><div><label class="form-label" for="product-category">Categoria</label><select class="form-select" id="product-category" required><option value="" selected disabled>Selecione</option><option>Vestuário</option><option>Acessórios</option><option>Casa</option></select></div></div>
        <div class="modal-footer"><button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary" type="submit">Salvar</button></div>
      </form>
    </div></div>
  </div>
  <div class="modal fade" id="delete-modal" tabindex="-1" aria-labelledby="delete-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm"><div class="modal-content"><div class="modal-header"><div><h2 class="modal-title fs-5" id="delete-modal-title">Excluir registro?</h2><p class="small text-secondary mb-0" id="delete-modal-message"></p></div><button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Fechar"></button></div><div class="modal-footer"><button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-danger" id="confirm-delete" type="button">Excluir</button></div></div></div>
  </div>
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container" aria-live="polite" aria-atomic="true"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/validacoes.js"></script>
  <script src="js/calculadora.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
